# Python build manifest for Testinium-QA. pom.xml stays in the tree as
# historical reference only and is no longer a supported build configuration.

[build-system]
# Exact-pinned like every other pin in the port: the backend is what turns this
# manifest - including the dynamic dependency table below - into metadata, so a
# floating requirement could change the distribution with no file changing.
# 84.0.0 is the version verified on the pinned 3.14.6 interpreter.
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "testinium-qa"
# PEP 440 mapping of the source build's 1.0-SNAPSHOT, preserving its
# pre-release semantics.
version = "1.0.0.dev0"
description = "Behave-driven Selenium browser test-automation suite for the Testinium/Odoo web application, with a read-only Flask viewer over the generated report artifacts"
readme = "README.md"
# Pinned narrowly on purpose: the verified interpreter is 3.14.6 and CI and
# development must not drift apart (see .python-version).
requires-python = "==3.14.*"

# requirements.txt is the one authoritative runtime list, resolved into
# Requires-Dist through [tool.setuptools.dynamic] below, so it has to stay
# committed beside this manifest: a build whose source tree lacks that file
# emits no warning and simply declares no dependencies at all.
dynamic = ["dependencies"]

[project.scripts]
run-tests = "app.cli:run_tests"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

# Flat layout: `app` and its sub-packages are the only installable code, while
# features/, tests/ and scripts/ sit beside it at the repository root and are
# not distributions. `namespaces = false` keeps the __init__-less resource
# directories under app/ from being picked up as implicit namespace packages;
# they ship as the package data below instead.
[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["features*", "tests*", "scripts*"]
namespaces = false

# Deliberately not restricted to text extensions: the vendored asset set
# includes binary fonts (.otf, .eot, .ttf, .woff, .woff2) and a PNG favicon, and
# a wheel missing them produces unstyled reports with broken href/src
# references.
[tool.setuptools.package-data]
app = [
    "templates/*.html",
    "templates/**/*.html",
    "static/css/*.css",
    "static/js/*.js",
    "static/vendor/*",
    "static/vendor/**/*",
]
