# pytest configuration: test selection for the port's own unit suite under
# tests/. The Gherkin suite is a separate thing entirely - it is run by behave
# through the `run-tests` console script, and behave.ini configures it.

[pytest]

# Matches the pin in requirements-test.txt, so a hand-assembled environment
# carrying an older pytest fails loudly here instead of silently ignoring keys
# it does not recognise.
minversion = 9.1.1

# With no path argument, pytest collects from tests/ and nowhere else, which
# is what keeps the behave step definitions under features/steps/ out of the
# unit suite: they are glue matched by phrase at scenario runtime and define no
# pytest tests.
testpaths = tests

# Collection patterns, declared explicitly so the suite's naming contract is
# visible rather than implied. They govern normal recursive discovery only: an
# explicit file or node-id argument reaches a module whatever its name, so the
# behave step modules stay out by way of testpaths and norecursedirs, not by
# these patterns. tests/fixtures/ holds report fixture data and no Python
# module, so discovery finds nothing there to match. The step modules are
# imported deliberately and in-process by tests/test_steps_registration.py and
# the ten tests/test_steps_<area>.py parity modules; nothing here affects that.
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Directories never recursed into. Setting this key REPLACES pytest's built-in
# list rather than adding to it, which is why the nine defaults are restated
# below alongside the project entries - pruning them would put them back in
# play. The project entries hold the collection boundary for an invocation that
# passes a path and so bypasses testpaths (`pytest .`), and keep collection
# cheap in a workspace where .venv/ and target/ are large.
norecursedirs =
    features
    scripts
    app
    target
    .venv
    venv
    *.egg
    .*
    _darcs
    build
    CVS
    dist
    node_modules
    {arch}

# Options applied to every invocation. Strictness and diagnostics only: not one
# of them changes which tests are selected or how an outcome is judged.
#   --strict-config   a misspelled or unknown key in this file becomes an error
#                     rather than a warning that scrolls past unread
#   --strict-markers  an unregistered @pytest.mark becomes an error rather than
#                     a typo that silently selects nothing. A test needing a
#                     custom marker registers it in a `markers` key here; none
#                     is needed today, so none is declared
#   --tb=short        one frame per failure - enough to locate it without
#                     burying the CI log
#   -ra               a short summary of every non-passing outcome at the end
#   --disable-plugin-autoload
#                     no third-party plugin is imported unless a command asks
#                     for it by name. Without it pytest imports EVERY installed
#                     distribution advertising a pytest11 entry point, at
#                     startup, before collection - so a distribution that
#                     arrived in the environment by any route at all would
#                     execute code inside the unit gate and inside each of the
#                     four coverage gates. The only plugin this project needs is
#                     pytest-cov, and the four scoped coverage commands - in the
#                     Makefile's coverage target and in both runner scripts -
#                     load it explicitly with `-p pytest_cov`; the unit gate
#                     needs no plugin and therefore loads none. This is a
#                     selection-neutral switch: it changes what code runs
#                     alongside the tests, never which tests are selected or how
#                     an outcome is judged
# Deliberately absent: -x/--exitfirst, because the Makefile evaluates one
# threshold gate per scope and a scope's run has to finish before its gate can
# be judged - stopping at the first failure would leave the gate meaning
# nothing; -q, so that the header naming rootdir and this configfile stays
# visible in a CI log; and any process-distribution switch.
addopts =
    --strict-config
    --strict-markers
    --tb=short
    -ra
    --disable-plugin-autoload

# No coverage threshold is declared here: the four gates are per package
# (app/utils, app/pages, app/automation, app/reporting), which one global
# threshold cannot express, so they live in the Makefile's `coverage` target as
# one scoped pytest run each.
