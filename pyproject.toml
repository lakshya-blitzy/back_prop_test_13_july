[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "testinium-qa"
# PEP 440 mapping of the source build's 1.0-SNAPSHOT, preserving pre-release
# semantics (pom.xml <version>1.0-SNAPSHOT</version>).
version = "1.0.0.dev0"
description = "Testinium-QA browser test-automation framework - Python 3 / Flask port"
readme = "README.md"
# Pinned narrowly on purpose: the verified interpreter is 3.14.6 and CI and
# development must not drift apart (see .python-version).
requires-python = "==3.14.*"

dependencies = [
    "Flask==3.1.3",
    "Jinja2==3.1.6",
    "click==8.5.0",
    "behave==1.3.3",
    "cucumber-tag-expressions==11.0.1",
    "selenium==4.48.0",
    "webdriver-manager==4.1.2",
]

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
    "pytest-cov==7.0.0",
]

# The single command surface: the Gherkin suite runner. Invoked from
# scripts/run_tests.sh, scripts/run_tests.ps1, the Makefile and the README via
# the virtual environment's bin/Scripts directory - never through the Flask CLI.
[project.scripts]
run-tests = "app.cli:run_tests"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = [
    "templates/*.html",
    "templates/**/*.html",
    "static/css/*",
    "static/js/*",
    "static/vendor/**/*",
]
