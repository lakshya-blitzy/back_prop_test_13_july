# =============================================================================
# pytest.ini -- the single source of truth for test configuration.
#
# WHAT THIS FILE IS
# -----------------
# A one-to-one translation of the two constructs that specify how the source
# project ran its tests: the documented Cucumber runner -- @CucumberOptions on
# CukesRunner [README.md:L71-L93] -- and the Maven Surefire plugin configuration
# [pom.xml:L21-L29]. Every field of both is accounted for below. Each one either
# lands in a setting in this file, or is delegated in a comment to the module
# that owns it. Nothing is silently dropped.
#
# pyproject.toml deliberately contains NO [tool.pytest.ini_options] table, and no
# [tool.pytest] table of any shape, so this file can never be silently
# superseded. pytest settings do not belong there.
#
# THE DEFAULT RUN SELECTS ZERO SCENARIOS (preserved defect D2)
# -----------------------------------------------------------
# `addopts` carries `-m "LogOut"`, the faithful port of tags = "@LogOut"
# [README.md:L87]. pytest-bdd turns a Gherkin tag into a pytest mark and strips
# the leading `@`, which is why the selector is spelled without one. No scenario
# carries that tag: tests/features/login.feature holds only @Login, @UPGN-286,
# @UPGN-287, @UPGN-288, @SalesManager and @PosManager. A default `pytest` run
# therefore reports "6 deselected, 0 selected" and exits with code 5 -- and that
# is a SUCCESS, a successful zero-scenario run. The source pipeline went green in
# exactly this situation, because Surefire found nothing matching the tag filter
# and the report publisher's six all-`-1` thresholds gated nothing. The defect is
# preserved deliberately and never quietly corrected; the one-line fix the owners
# may elect is recorded in docs/migration-parity.md.
#
# Two consequences, both operational:
#
#   * Running the Python suites that are not part of the ported Cucumber run
#     means overriding the filter on the command line with `-m ""`, which is
#     exactly what Makefile:L51's NO_TAG_FILTER := -m "" exists for; tests/unit,
#     tests/integration and tests/parity are all run that way. A command-line -m
#     always wins over the one carried by addopts.
#   * Runs driven through the service layer -- POST /api/v1/runs, or
#     app/services/test_runner_service.py directly -- clear it by setting the
#     TAG_EXPRESSION environment variable, or tag.expression in
#     configuration.properties, to an empty value. Editing this file is never the
#     way to opt into a run that selects scenarios.
#
# THE NON-GATING EXIT-CODE POLICY (the port of testFailureIgnore)
# --------------------------------------------------------------
# <testFailureIgnore>true</testFailureIgnore> [pom.xml:L25] is not expressible as
# a pytest option: it is an exit-code policy. It is owned by
# app/services/test_runner_service.py and mirrored by the Makefile `test` target,
# which is why this file carries no -x, no --exitfirst and no --maxfail -- any of
# them would change how failures are handled. The mapping those owners implement:
#
#     0  every selected test passed             -> success
#     1  tests ran and some of them failed      -> SUCCESS, non-gating; this is
#                                                 the whole of testFailureIgnore
#     2  the run was interrupted                -> hard failure
#     3  an internal error occurred             -> hard failure
#     4  pytest usage or command-line error     -> hard failure
#     5  nothing collected, or all deselected   -> SUCCESS, zero scenarios; the
#                                                 default case described above
#
# Report generation runs even after a failing test stage: the pipeline's
# 'Generate report' stage [Jenkins:L13-L15] is unconditional and all six of its
# publisher thresholds are -1, so nothing gates. Defect D3, preserved.
#
# FOUR CUCUMBER PLUGINS, ONLY TWO OF WHICH ARE PYTEST FLAGS
# ---------------------------------------------------------
#   html:target/cucumber-reports.html                     [README.md:L78]
#       --html=target/cucumber-reports.html plus --self-contained-html, from
#       pytest-html.
#   json:target/cucumber.json                             [README.md:L79]
#       --cucumberjson=target/cucumber.json, pytest-bdd's native writer.
#   rerun:target/rerun.txt                                [README.md:L80]
#       NO pytest option exists. app/reporting/rerun_report.py writes it,
#       deriving one `<uri>:<line>` entry per failing scenario from
#       target/cucumber.json. Do not go looking here for a missing flag.
#   me.jvt.cucumber.report.PrettyReports:target/cucumber  [README.md:L81]
#       NO pytest option exists. app/reporting/pretty_reports.py writes it by
#       post-processing target/cucumber.json -- which is what the Java plugin
#       me.jvt.cucumber:reporting-plugin:7.2.0 [pom.xml:L66-L70] did as well: it
#       rendered a report directory from the JSON rather than terminal output.
#
# target/ MUST ALREADY EXIST WHEN A RUN STARTS
# --------------------------------------------
# pytest-bdd's Cucumber-JSON writer opens its file directly and does not create
# the parent directory, so --cucumberjson=target/cucumber.json raises
# FileNotFoundError at session finish when target/ is missing (verified against
# pytest-bdd 8.1.0). `mvn clean test` got that directory for free from Maven; the
# Python port creates it explicitly, in three places so it cannot be missed:
# app/utils/paths.py, the Makefile `dirs` and `test` targets, and
# tests/conftest.py. The --junitxml option below does create its own parent
# directories and so happens to create target/ first, but that is hook-ordering
# luck rather than a contract and must never be relied on.
#
# NO GHERKIN TERMINAL REPORTER IN THE DEFAULT OPTION SET
# -----------------------------------------------------
# pytest-bdd's Gherkin terminal reporter is mutually exclusive with xdist:
# pytest-bdd carries an explicit guard that refuses to install it once xdist's
# `dsession` plugin is registered, and even where plugin-configure ordering lets
# that guard pass, xdist owns the terminal and the Gherkin output never appears.
# Because the default option set below reproduces Surefire's parallelism with
# `-n logical`, that reporter's flag is deliberately ABSENT from this file. It is
# reachable only through the dedicated serial target, `make test-pretty`, where
# the flag is spelled out in full; that target passes `-n 0` and is mutually
# exclusive with the default invocation. The flag's literal spelling is kept out
# of this file on purpose, so that searching this file for it stays an exact
# guard instead of also matching the comment that explains its absence.
#
# `make test-pretty` must not use `-p no:xdist` either: deactivating the plugin
# leaves the `-n logical` carried by addopts unclaimed and pytest aborts with
# "unrecognized arguments: -n" -- a usage error, exit 4, before anything runs.
# =============================================================================
[pytest]

# The floor this configuration needs. The exact version is pinned once, in
# requirements-test.txt (pytest==9.1.1); this is a minimum, not a second pin.
minversion = 9.1

# A missing plugin becomes a loud startup error instead of a silent change of
# behaviour: without pytest-bdd there are no scenarios at all, and without
# pytest-xdist or pytest-html the `-n logical` and `--html` options below are
# unrecognized arguments. Versions are deliberately not repeated here.
required_plugins = pytest-bdd pytest-xdist pytest-html

# COLLECTION. Surefire collected <include>**/CukesRunner*.java</include>
# [pom.xml:L27]; pytest collects the ported runner module,
# tests/step_defs/test_cukes_runner.py, which *is* the collected target because
# pytest-bdd cannot execute a .feature file directly. The same patterns pick up
# the unit, integration and parity suites. tests/step_defs/login_sd.py is
# deliberately NOT a test_*.py file: it is the port of
# glue = "com/testinium/step_definitions" [README.md:L85], and because pytest-bdd
# has no glue mechanism the runner module imports that module outright.
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Cucumber's features = "src/main/resources/features" [README.md:L84]. pytest-bdd
# joins this base directory with whatever path scenarios() is given, so the
# ported runner calls scenarios("login.feature") and it resolves to
# tests/features/login.feature. The repository-relative path must NOT be passed
# to that call as well: it would resolve to
# tests/features/tests/features/login.feature and raise FileNotFoundError. This
# setting and the runner module are one source of truth, not two competing ones.
bdd_features_base_dir = tests/features

# THE DEFAULT OPTION SET.
#   -ra, --tb=short         readable output; cosmetic only.
#   --strict-markers        an unregistered mark becomes a collection error
#                           rather than a warning, which is what makes the
#                           `markers` list below load-bearing.
#   -m "LogOut"             tags = "@LogOut" [README.md:L87]. Selects nothing;
#                           preserved defect D2, see the header.
#   --cucumberjson=...      plugin json:target/cucumber.json [README.md:L79].
#   --html=...,             plugin html:target/cucumber-reports.html
#   --self-contained-html   [README.md:L78], written as one portable file.
#   --junitxml=...          target/surefire-reports/ keeps its name for
#                           report-consumer parity, and TEST-<class>.xml is
#                           Surefire's own convention for the runner it collected
#                           [pom.xml:L27]. The path matches
#                           app/utils/paths.py::SUREFIRE_JUNIT_XML_PATH exactly.
#   -n logical              <parallel>methods</parallel> [pom.xml:L22] with
#                           <useUnlimitedThreads>true</useUnlimitedThreads>
#                           [pom.xml:L23].
# There is deliberately no --collect-only: its absence is how dryRun = false
# [README.md:L86] is expressed.
addopts =
    -ra
    --tb=short
    --strict-markers
    -m "LogOut"
    --cucumberjson=target/cucumber.json
    --html=target/cucumber-reports.html
    --self-contained-html
    --junitxml=target/surefire-reports/TEST-CukesRunner.xml
    -n logical
# Surefire's tuning default was left commented out in the POM:
#     <!--                    <threadCount>4</threadCount>-->        [pom.xml:L24]
# It is preserved here in exactly that state: present, documented and DISABLED.
# Uncommenting the line below would pin the worker count to four and silently
# replace the unlimited-thread semantics above. Do not activate it.
# -n 4

# MARKERS. pytest-bdd turns every Gherkin tag into a pytest mark and strips the
# leading `@`, so the bare names are what gets registered. Registration is not
# optional: an unregistered mark raises PytestUnknownMarkWarning on every run and
# each xdist worker warns independently, so a handful of warnings serially
# becomes a flood under `-n logical`. With --strict-markers in force it is a hard
# collection error instead, which is the intent -- a new tag has to be declared
# here. The hyphens are part of the Jira issue keys: they are legal in this list,
# they stay selectable (`pytest -m "UPGN-288"` works), and they must never be
# rewritten to underscores.
markers =
    Login: Feature-level tag of the Testinium app login feature [README.md:L104].
    UPGN-286: Jira tag, valid credentials [README.md:L115]. No Examples table binds to it, so its steps run with the literal placeholders (defect D1).
    UPGN-287: Jira tag, invalid email or password [README.md:L123]. Traceability only: its scenario name collides with the next outline's (defect D9).
    UPGN-288: Jira tag, empty username or password field [README.md:L131]. The only outline the two Examples tables bind to.
    SalesManager: Examples-table tag, the SalesManager data set [README.md:L137].
    PosManager: Examples-table tag, the PosManager data set [README.md:L144].
    LogOut: The default addopts selector, from tags = "@LogOut" [README.md:L87]. No scenario carries it (defect D2); registered to document it, not to legitimise it.

# WARNING FILTERS -- a correctness control, not tidiness.
# The list is default-strict: `error` comes first, so any warning that is not
# explicitly excepted below fails the run and nothing is silently swallowed. That
# is what keeps the marker registration above honest; a blanket `ignore`, or an
# `ignore` of a whole warning category, would hide the very warning that
# registration exists to prevent (PytestUnknownMarkWarning) and the regression
# would go unnoticed.
#
# Exactly one exception is granted, and it names both a message substring and the
# module it originates in, so it cannot mask anything else. gherkin-official
# 29.0.0 -- the parser pytest-bdd depends on -- calls re.split(r"\s#", text, 2)
# in gherkin/gherkin_line.py, and CPython 3.14 deprecates passing `maxsplit`
# positionally; the warning is third-party, benign and emitted once per scanned
# line. Verified both ways: with the exception removed the run aborts during
# collection, and with it in place the suite emits zero warnings serially and
# under `-n logical`. Any further exception must be just as narrow, and must say
# what it is and why it is safe.
filterwarnings =
    error
    ignore:'maxsplit' is passed as positional argument:DeprecationWarning:gherkin.gherkin_line
