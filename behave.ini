# Configuration for the Gherkin engine (behave). Maintained by hand: nothing
# generates this file, and every value here is a default the command line can
# override for a single run. It is the Python port of the @CucumberOptions
# annotation on the Java runner, src/main/java/com/testinium/runners/
# CukesRunner.java at reference commit
# 47e9d697e4a9a85da889f94a846fdf47af28a240: five keys carry that annotation
# across, and one more - stage, at the foot of the section - pins the glue
# roots the annotation's fixed features/glue paths implied.
#
# Kept strictly ASCII: behave reads this file with ConfigParser.read(), which
# decodes using the locale's preferred encoding, so a non-ASCII byte in a
# comment would break the engine under an ASCII locale such as LC_ALL=C.

[behave]

# Gherkin discovery root. The suite lives in features/ because behave finds
# environment.py relative to this directory and the step modules by convention
# in its steps/ subdirectory, so moving the directory would silently unhook
# both.
paths = features

# Default tag filter, and deliberately default_tags rather than tags: a
# config-file tags key would take precedence over this default and become the
# engine's own config tag expression, whereas default_tags applies only when
# the command line supplies no filter of its own. That keeps the filter
# overridable and clearable, which the rerun path depends on - it passes a
# filter that selects everything so this default cannot skip a failure from an
# unselected feature. @Smoke is declared once in the suite, so a default run
# selects the CRM feature alone.
default_tags = @Smoke

# Scenarios really run by default; --dry-run overrides this for a single run.
dry_run = false

# Step and scenario durations are measured because the report contract carries
# a per-step duration as a nanosecond integer.
show_timings = true

# No JUnit XML is produced: the pipeline publishes through its Cucumber plugin,
# which reads the Cucumber JSON report instead.
junit = false

# The glue roots, pinned. This key translates no part of the annotation: the
# Java runner named its glue package outright (CukesRunner.java:16), and this
# key is how the same fixedness is stated to behave.
#
# behave selects the step directory and the environment file by prefixing them
# with the stage name, so a stage of "product" means product_steps and
# product_environment.py. It takes that name from the BEHAVE_STAGE environment
# variable whenever nothing else sets one, joins it to the discovery root
# above with os.path.join - so an ABSOLUTE value wins outright and redirects
# both roots outside this checkout - and it EXECUTES the environment file it
# arrives at. An ambient BEHAVE_STAGE=/external/path is therefore enough to
# make the engine load steps from /external/path_steps and run
# /external/path_environment.py.
#
# An empty value here pins both to the tracked features/steps and
# features/environment.py, because behave consults the variable only when the
# stage is None: a key that is present and empty is not None, so the variable
# is never reached. Measured on this engine version - with
# BEHAVE_STAGE=/external/path set, this file yields steps_dir = "steps" and
# environment_file = "environment.py".
#
# The value is deliberately empty and must not be given a name: any name at
# all would send both roots to <name>_steps and <name>_environment.py, which
# do not exist in this repository. This file's half of the binding is what
# makes it true for a direct `behave` invocation; the run service,
# app/services/test_run_service.py, passes the same empty stage on every
# worker command line, so a worker holds even if this key is lost.
stage =

# ---------------------------------------------------------------------------
# Deliberately absent, and load-bearing - please do not "helpfully" fix this.
#
# No formatter key and no output-file key. behave accepts both, so leaving them
# out is a decision rather than an oversight. Scenarios are sharded across a
# process pool and every worker needs an output file of its own; a static
# configuration file cannot hand each one a distinct path, so the run service
# invokes behave once per worker with the formatter and -o <path> on the
# command line, each path unique by process id and shard index. Declaring one
# here would aim every worker at the same file, and the merge step would
# silently see a single shard's results instead of all of them.
#
# For the same reason no report or artifact path appears anywhere in this file.
# Those paths have exactly one owner, app/utils/paths.py.
#
# This file also has exactly one section. The browser override reaches each
# worker as -D browser=<name> so that userdata outranks the properties file on
# every run, and a parallelism setting would be inert here because behave ships
# only its default runner - the concurrency is this port's own process pool.
# ---------------------------------------------------------------------------
