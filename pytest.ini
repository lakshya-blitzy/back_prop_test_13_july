# =============================================================================
# pytest.ini - the SINGLE source of truth for test configuration.
#
# This file is a one-to-one port of two source constructs:
#
#   1. The documented Cucumber runner (@CucumberOptions on CukesRunner,
#      README.md "Using canned test in the project"):
#         plugin = html:target/cucumber-reports.html          -> --html + --self-contained-html
#         plugin = json:target/cucumber.json                  -> --cucumberjson
#         plugin = rerun:target/rerun.txt                     -> derived from the JSON report
#         plugin = me.jvt.cucumber.report.PrettyReports:target/cucumber
#                                                             -> derived from the JSON report
#         features = "src/main/resources/features"            -> bdd_features_base_dir
#         glue     = "com/testinium/step_definitions"         -> ordinary Python imports
#         dryRun   = false                                    -> absence of --collect-only
#         tags     = "@LogOut"                                -> -m "LogOut"
#
#   2. The Maven Surefire configuration (pom.xml, REFERENCE):
#         <parallel>methods</parallel>
#         <useUnlimitedThreads>true</useUnlimitedThreads>      -> -n logical
#         <!-- <threadCount>4</threadCount> -->                -> commented `-n 4` below
#         <testFailureIgnore>true</testFailureIgnore>          -> non-gating exit-code policy
#                                                                (Makefile / test_runner_service)
#         <includes>**/CukesRunner*.java</includes>            -> tests/step_defs/test_cukes_runner.py
#
# NOTE 1: pyproject.toml deliberately contains NO [tool.pytest.ini_options]
#         table, so this file can never be silently superseded.
# NOTE 2: `-m "LogOut"` is the faithful port of tags = "@LogOut". The feature
#         file carries only @Login/@UPGN-286/@UPGN-287/@UPGN-288/@SalesManager/
#         @PosManager, so the default invocation deselects every scenario and
#         pytest exits with code 5. That is PRESERVED behaviour and must be
#         reported as a SUCCESSFUL zero-scenario run. Suites that are not part
#         of the ported BDD run (tests/unit, tests/integration, tests/parity)
#         override the filter on the command line with `-m ""`; see the Makefile.
# NOTE 3: --gherkin-terminal-reporter is deliberately ABSENT: pytest-bdd raises
#         "gherkin-terminal-reporter is not compatible with 'xdist' plugin."
#         during configure and aborts with INTERNALERROR. Use `make test-pretty`
#         (serial, no -n) when the Gherkin terminal output is wanted.
# NOTE 4: the --cucumberjson writer does NOT create its parent directory; the
#         `target/` tree must exist before the run (Makefile `test` target,
#         app/utils/paths.py and tests/conftest.py all guarantee this).
# =============================================================================
[pytest]
minversion = 9.1

# `mvn clean test` collected **/CukesRunner*.java; pytest collects the ported
# runner module (tests/step_defs/test_cukes_runner.py) plus the Python suites.
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Cucumber `features` option: base directory for scenarios() path arguments.
# pytest-bdd JOINS this base directory with whatever path scenarios() receives,
# so the ported runner must call `scenarios("login.feature")` (resolving to
# tests/features/login.feature). Do NOT pass the repository-relative path
# "tests/features/login.feature" here - it would resolve to
# tests/features/tests/features/login.feature and raise FileNotFoundError.
bdd_features_base_dir = tests/features

addopts =
    -ra
    -m "LogOut"
    --cucumberjson=target/cucumber.json
    --html=target/cucumber-reports.html
    --self-contained-html
    --junitxml=target/surefire-reports/TEST-CukesRunner.xml
    -n logical
#   Surefire's commented-out tuning default (<!-- <threadCount>4</threadCount> -->)
#   is preserved here, disabled, exactly as in pom.xml:
#   -n 4

# Gherkin tags become pytest marks (pytest-bdd strips the leading `@`). All six
# tags present in the feature file are registered so that no
# PytestUnknownMarkWarning is emitted (verified: unregistered tags warn once per
# worker - 8 warnings serially, 64+ under `-n logical`).
markers =
    Login: Feature-level tag of the Testinium app login feature.
    UPGN-286: Jira traceability tag - users log in with valid credentials.
    UPGN-287: Jira traceability tag - invalid email / invalid password credentials.
    UPGN-288: Jira traceability tag - empty username or password field.
    SalesManager: Examples-table tag - SalesManager account data set.
    PosManager: Examples-table tag - PosManager account data set.
    LogOut: Tag expression used by the ported runner (tags = "@LogOut") - no scenario carries it, which is the preserved zero-selection behaviour.

# Warnings are shown by default; only the single known-benign third-party
# deprecation is silenced, and it is recorded explicitly (never a blanket
# `ignore::DeprecationWarning`) so that any NEW warning still surfaces.
# Origin: gherkin/gherkin_line.py:79 - re.split(..., 2) under CPython 3.14.
filterwarnings =
    default
    ignore:'maxsplit' is passed as positional argument:DeprecationWarning
