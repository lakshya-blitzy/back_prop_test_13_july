# pytest configuration - Testinium-QA (Python 3.14 port).
#
# This file replaces the surefire test-selection block of the Java build,
# pom.xml:26-28:
#     <includes><include>**/CukesRunner*.java</include></includes>
# Surefire pointed JUnit at the Cucumber runner class, which is how the Java
# project executed its Gherkin suite. The port has no runner class: the Gherkin
# suite is executed by behave through the `run-tests` console script, and
# behave.ini owns that engine's configuration. What is left for pytest to
# select is the port's own unit suite under tests/, which is what this file
# describes and the whole of what it describes.
#
# Scope: TEST SELECTION ONLY. No measurement instrumentation and no quality
# threshold appears here - see the closing note, which states why, and where
# they do live.
#
# Kept strictly ASCII on purpose. pytest reads this file through iniconfig,
# which decodes UTF-8, but configparser.read() - the documented way to check
# that this file parses - decodes using the locale's preferred encoding, so a
# non-ASCII byte would break under an ASCII locale such as LC_ALL=C.
#
# Comments occupy whole lines only, and never appear inside a value. Neither
# iniconfig nor configparser strips a trailing "#..." from a value, and pytest
# splits its "args"-typed values with shlex.split(), which does not treat "#"
# as a comment either, so an inline comment would end up parsed as data.

[pytest]

# Lower bound on the runner, set to the exact pin in requirements-test.txt
# (pytest==9.1.1) - the version both runner scripts and the Makefile install,
# and the version this configuration was verified against. Declared so that a
# hand-assembled environment carrying an older pytest fails loudly here instead
# of silently ignoring keys it does not recognise.
minversion = 9.1.1

# The single most important line in the file: with no path argument, pytest
# collects from tests/ and nowhere else. That is what keeps the behave step
# definitions under features/steps/ out of the unit suite - they are glue
# matched by phrase at scenario runtime, they define no pytest tests, and
# importing them as test modules would buy nothing but import side effects.
# tests/test_steps_registration.py and the ten tests/test_steps_<area>.py
# parity modules import those modules deliberately, in-process; nothing here
# interferes with that import.
testpaths = tests

# Collection patterns, declared explicitly rather than inherited from the
# defaults so that the naming contract is visible in the file rather than
# implied. Every module of the suite is named test_*.py, which is also why
# tests/fixtures/ is safe: it holds report fixture data - golden_cucumber.json,
# golden_rerun.txt, sample_results.json - and no .py file, so there is nothing
# there for these patterns to match. For the same reason the *_steps.py modules
# under features/steps/ are unmatchable even when a path argument reaches them.
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Directories never recursed into. Setting this key REPLACES pytest's built-in
# list, so the nine defaults are restated below the project entries to keep
# them in force. The project entries make the collection boundary explicit for
# an invocation that passes a path and therefore bypasses testpaths entirely
# (`pytest .`), and they keep collection cheap in a CI workspace where .venv/
# and target/ are both present and large:
#   features  the feature files, environment.py and the behave step modules
#   scripts   the POSIX and PowerShell entry points
#   app       the application package - its tests live in tests/
#   target    generated report artifacts and the per-worker intermediates
#   .venv     the per-clone virtual environment (also matched by .*)
#   venv      the alternative virtual environment name
norecursedirs =
    features
    scripts
    app
    target
    .venv
    venv
    *.egg
    .*
    _darcs
    build
    CVS
    dist
    node_modules
    {arch}

# Options applied to every invocation. Strictness and diagnostics only: not one
# of them changes which tests are selected or how an outcome is judged.
#   --strict-config   a misspelled or unknown key in this file becomes an error
#                     rather than a warning that scrolls past unread
#   --strict-markers  an unregistered @pytest.mark becomes an error rather than
#                     a typo that silently selects nothing. A test needing a
#                     custom marker registers it in a `markers` key here; none
#                     is needed today, so none is declared
#   --tb=short        one frame per failure - enough to locate it without
#                     burying the CI log
#   -ra               a short summary of every non-passing outcome at the end
# Deliberately absent: -x/--exitfirst, because the Makefile evaluates one
# threshold gate per scope and a scope's run has to finish before its gate can
# be judged - stopping at the first failure would leave the gate meaning
# nothing; -q, so that the header naming rootdir and this configfile stays
# visible in a CI log; and any plugin-autoload or process-distribution switch.
addopts =
    --strict-config
    --strict-markers
    --tb=short
    -ra

# ---------------------------------------------------------------------------
# Deliberately absent, and load-bearing - please do not "helpfully" add it.
#
# No measurement instrumentation, no report flag for it and no threshold key of
# any kind. The four gates are per package - app/utils 90, app/pages 85,
# app/automation 80, app/reporting 80 - and a single global threshold cannot
# express four of them, so the Makefile runs pytest once per scope, each run
# measuring and gating only its own package and the target stopping at the
# first miss. A threshold written here would instead apply to every invocation,
# including the plain unit-test target and the unit gate inside the runner
# scripts, and would either fail runs that were never meant to be gated or hide
# a per-scope miss behind a whole-project average. Test selection lives here,
# the thresholds live in the Makefile, and each is stated exactly once - which
# also means a blunt grep of this file is enough to prove that no invocation of
# the unit suite is being silently gated behind the developer's back.
#
# No pythonpath key and no sys.path manipulation. Making `import app` and
# `import features.steps.<module>` resolve from the repository root is
# tests/conftest.py's job, and splitting that across two files would leave
# neither of them the answer to where the import path comes from.
#
# No behave key of any kind: behave.ini owns the Gherkin engine's configuration,
# including the tag default and the deliberate absence of a formatter output
# path.
#
# No artifact path literal. The four report artifact paths have exactly one
# owner, app/utils/paths.py. The `target` entry in norecursedirs above names a
# directory to skip during collection; it is not a report path, and no report
# path belongs in this file.
#
# No pytest-bdd and no process-distribution plugin configuration. Neither is a
# pinned dependency: there is one Gherkin engine, and scenario-level
# parallelism belongs to the process pool in app/services/test_run_service.py,
# not to the unit suite.
#
# No blanket filterwarnings ignore, which would hide precisely the deprecation
# warning a port pinned to exact dependency versions needs to see.
# ---------------------------------------------------------------------------
