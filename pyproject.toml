# =============================================================================
# pyproject.toml - PEP 621 project metadata + lint/format/type-check settings.
#
# Ports the Maven project coordinates declared in pom.xml (REFERENCE):
#     <groupId>org.example</groupId>
#     <artifactId>testinium-qa</artifactId>       -> name    = "testinium-qa"
#     <version>1.0-SNAPSHOT</version>             -> version = "1.0.0.dev0"
#                                                    (PEP 440 rendering of a
#                                                     Maven SNAPSHOT)
#     <maven.compiler.source>8</maven.compiler.source>
#     <maven.compiler.target>8</maven.compiler.target>
#                                                 -> requires-python = ">=3.14"
#                                                    (+ .python-version = 3.14.6)
#
# IMPORTANT: this file deliberately contains NO [tool.pytest.ini_options] table.
# pytest.ini is the single source of test configuration and must never be
# silently superseded from here.
#
# Runtime and harness dependencies are pinned in requirements.txt and
# requirements-test.txt (exact `==` pins). Only the optional quality-tooling
# group is declared here.
# =============================================================================

[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "testinium-qa"
version = "1.0.0.dev0"
description = "Testinium-QA - Python 3 / Flask port of the Selenium-Cucumber BDD automation project"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
keywords = ["flask", "pytest-bdd", "selenium", "cucumber", "bdd", "qa-automation"]
classifiers = [
    "Framework :: Flask",
    "Framework :: Pytest",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Testing :: BDD",
]

# The four quality tools. Install with:  pip install -e ".[dev]"
# (or directly:  pip install ruff==0.16.0 black==26.5.1 mypy==2.3.0 pytest-cov==7.1.0)
[project.optional-dependencies]
dev = [
    "ruff==0.16.0",
    "black==26.5.1",
    "mypy==2.3.0",
    "pytest-cov==7.1.0",
]

[project.urls]
# Clone target used by the CI pipeline (Jenkins stage 'Clone code').
Pipeline = "https://github.com/BalamiRR/Upgenix-QA.git"
# Clone target documented in the README "Framework set up" section. The two URLs
# disagree in the source project; both values are retained deliberately.
Documentation = "https://github.com/BalamiRR/Testinium-QA.git"

# Only the Flask application package is distributable; the BDD harness, scripts
# and docs trees are not packaged.
[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["tests*", "scripts*", "docs*", "target*"]

# -----------------------------------------------------------------------------
# ruff - lint + import ordering (PEP 8 enforcement)
# -----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py314"
src = ["app", "tests", "scripts"]
extend-exclude = [".venv", "target", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import ordering)
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "PL",  # pylint subset
    "RUF", # ruff-specific rules
]
ignore = [
    "PLR0913", # too many arguments - service/report adapters legitimately take many
    "PLR2004", # magic value comparison - parity constants are compared literally
]

[tool.ruff.lint.per-file-ignores]
# Step definitions and page objects intentionally use assert and long literals.
"tests/**/*.py" = ["B011", "PLR0915", "E501"]
# The BDD runner module exists only to call scenarios(); star-style re-exports
# and unused imports of step modules are how pytest-bdd discovers steps.
"tests/step_defs/test_cukes_runner.py" = ["F401", "F403"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# -----------------------------------------------------------------------------
# black - formatter (checked in --check mode by `make lint`, never auto-applied
# by the verification gate)
# -----------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py314"]
extend-exclude = '''
/(
    \.venv
  | target
  | build
  | dist
)/
'''

# -----------------------------------------------------------------------------
# mypy - static type checking (PEP 484 hints throughout the application)
# -----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.14"
files = ["app", "tests", "scripts"]
exclude = "(^|/)(\\.venv|target|build|dist)/"
explicit_package_bases = true
namespace_packages = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
# Application code carries full annotations.
module = ["app.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
# pytest-bdd generates test functions dynamically; step definitions and page
# objects are checked but not forced to annotate every fixture callback.
module = ["tests.*"]
disallow_untyped_defs = false

# -----------------------------------------------------------------------------
# coverage (pytest-cov) - artifacts stay under the ephemeral target/ tree so
# `make clean` (the port of `mvn clean`) wipes them.
# -----------------------------------------------------------------------------
[tool.coverage.run]
branch = true
source = ["app"]
data_file = "target/.coverage"

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.coverage.html]
directory = "target/coverage-html"
