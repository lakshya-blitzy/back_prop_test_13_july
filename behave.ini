# behave configuration - the Python port of the @CucumberOptions annotation on
# the Java runner, src/main/java/com/testinium/runners/CukesRunner.java at
# reference commit 47e9d697e4a9a85da889f94a846fdf47af28a240. Five keys carry
# that annotation across; nothing else belongs in this file, and nothing
# generates it - it is maintained by hand.
#
# Kept strictly ASCII: behave reads this file with ConfigParser.read(), which
# decodes using the locale's preferred encoding, so a non-ASCII byte in a
# comment would break the engine under an ASCII locale such as LC_ALL=C.

[behave]

# Gherkin discovery root. Translates CukesRunner.java:15
#     features = "src/main/resources/features"
# The suite lives in features/ at the repository root because behave discovers
# environment.py relative to this directory and step modules by convention in
# its steps/ subdirectory - which is why the Java runner's step-package
# declaration (CukesRunner.java:16) has no counterpart key here. Feature
# FILENAMES are unchanged: they appear in the JSON report uri, in the rerun
# manifest and in user commands.
paths = features

# Default tag filter. Translates CukesRunner.java:18
#     tags = "@Smoke"
# default_tags, and deliberately not tags: behave stores a config-file tags key
# as config_tags, which outranks default_tags and feeds the "{config.tags}"
# placeholder, whereas default_tags applies only when the command line supplies
# no filter of its own. That keeps the filter fully overridable and clearable,
# which the rerun path depends on - FailedTestRunner.java:9-12 declares no tags
# at all, so re-running failures must be able to drop this default outright.
# @Smoke is declared exactly once in the suite, at Crm.feature:1, so a default
# run selects the CRM feature alone. That is behaviour to reproduce, not a bug.
default_tags = @Smoke

# Translates CukesRunner.java:17 "dryRun = false". Stated explicitly to record
# the contract; --dry-run on the command line overrides it for a single run.
dry_run = false

# Measure step and scenario durations. The Cucumber JSON contract carries a
# per-step duration as a nanosecond integer, so timings have to be collected.
show_timings = true

# No JUnit XML. The Java plugin list (CukesRunner.java:9-14) produced none, and
# the pipeline publishes through its Cucumber plugin, which reads the cucumber
# JSON report.
junit = false

# ---------------------------------------------------------------------------
# Deliberately absent, and load-bearing - please do not "helpfully" fix this.
#
# No formatter key and no output-file key. behave accepts both, so leaving them
# out is a decision rather than an oversight. Scenarios are sharded across a
# process pool and every worker needs an output file of its own; a static
# configuration file cannot hand each one a distinct path, so the run service
# invokes behave once per worker with the formatter and -o <path> on the
# command line, each path unique by process id and shard index. Declaring one
# here would aim every worker at the same file, and the merge step would
# silently see a single shard's results instead of all of them.
#
# For the same reason no report or artifact path appears anywhere in this file.
# Those paths have exactly one owner, app/utils/paths.py.
#
# This file also has exactly one section. The browser override reaches each
# worker as -D browser=<name> so that userdata outranks the properties file on
# every run, and a parallelism setting would be inert here because behave ships
# only its default runner - the concurrency is this port's own process pool.
# ---------------------------------------------------------------------------
